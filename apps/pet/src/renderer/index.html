<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Everything this window renders is bundled beside it, so nothing needs to
      be fetched, framed or evaluated. The only outbound request is the reviewer
      poll on loopback.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src http://localhost:3000; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Rev — ThreadRev</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root">
      <!-- The thread. Drawn from Rev up to the panel anchor while opening. -->
      <svg id="thread" class="thread" aria-hidden="true">
        <path id="thread-path" class="thread__path" />
      </svg>

      <section
        id="panel"
        class="panel"
        role="dialog"
        aria-label="ThreadRev findings"
        aria-modal="true"
        inert
      >
        <header class="panel__head">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 60 60" class="mark__svg">

            </svg>
          </span>
          <div class="panel__ident">
            <span id="panel-title" class="panel__name">Findings</span>
            <span id="panel-sub" class="panel__sub" role="status" aria-live="polite">watching</span>
          </div>
          <span
            id="rev-chip"
            class="chip chip--rev"
            title="Revision these findings are bound to"
          >
            —
          </span>
          <button id="panel-close" class="icon-btn" type="button" aria-label="Close panel">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </header>

        <div id="view-findings" class="view">
        <div class="tabs" role="tablist" aria-label="Filter findings">
          <button
            class="tab"
            role="tab"
            id="tab-live"
            data-filter="live"
            aria-selected="true"
            aria-controls="panel-body"
            tabindex="0"
          >
            Live <span id="count-live" class="tab__n">0</span>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-stale"
            data-filter="stale"
            aria-selected="false"
            aria-controls="panel-body"
            tabindex="-1"
          >
            Stale <span id="count-stale" class="tab__n">0</span>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-all"
            data-filter="all"
            aria-selected="false"
            aria-controls="panel-body"
            tabindex="-1"
          >
            All
          </button>
        </div>

        <div class="scroller">
          <div
            id="panel-body"
            class="panel__body"
            role="tabpanel"
            aria-labelledby="tab-live"
            tabindex="0"
          ></div>
        </div>
        </div>

        <!-- Status: is the reviewer actually answering, and what is it bound to. -->
        <div id="view-status" class="view" hidden>
          <div class="scroller">
            <div class="panel__body sheet">
              <dl class="facts">
                <dt>Reviewer</dt>
                <dd id="fact-conn" class="facts__value">checking…</dd>

                <dt>Last answer</dt>
                <dd id="fact-age" class="facts__value">—</dd>

                <dt>Bound revision</dt>
                <dd id="fact-rev" class="facts__value mono">—</dd>

                <dt>Findings</dt>
                <dd id="fact-counts" class="facts__value">—</dd>

                <dt>Endpoint</dt>
                <dd id="fact-endpoint" class="facts__value mono trunc">—</dd>
              </dl>

              <div class="stack">
                <button id="go-console" class="action" type="button">
                  <span class="action__label">Open review console</span>
                  <span class="action__hint">threads, diffs, evidence graph</span>
                  <svg class="action__go" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M6 3l5 5-5 5" />
                  </svg>
                </button>
                <button id="go-voice" class="action" type="button">
                  <span class="action__label">Open voice review</span>
                  <span class="action__hint">talk through a finding</span>
                  <svg class="action__go" viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M6 3l5 5-5 5" />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Settings: the same options as the tray, in the app's own skin. -->
        <div id="view-settings" class="view" hidden>
          <div class="scroller">
            <div class="panel__body sheet">
              <label class="row">
                <span class="row__text">
                  <span class="row__label">Always on top</span>
                  <span class="row__hint">Stay above other windows</span>
                </span>
                <input id="set-ontop" class="switch" type="checkbox" />
              </label>

              <label class="row">
                <span class="row__text">
                  <span class="row__label">Reduce motion</span>
                  <span class="row__hint">Stop the idle breath and transitions</span>
                </span>
                <input id="set-motion" class="switch" type="checkbox" />
              </label>

              <div class="row row--stacked">
                <span class="row__text">
                  <span class="row__label">Sleep when idle</span>
                  <span class="row__hint">Rev closes its aperture after this long</span>
                </span>
                <div id="set-sleep" class="segmented" role="radiogroup" aria-label="Sleep when idle">
                  <button class="segmented__opt" type="button" role="radio" data-min="0">Never</button>
                  <button class="segmented__opt" type="button" role="radio" data-min="2">2m</button>
                  <button class="segmented__opt" type="button" role="radio" data-min="5">5m</button>
                  <button class="segmented__opt" type="button" role="radio" data-min="15">15m</button>
                </div>
              </div>

              <div class="stack">
                <button id="set-reset" class="action" type="button">
                  <span class="action__label">Reset position</span>
                  <span class="action__hint">Back to the bottom-right corner</span>
                </button>
                <button id="set-quit" class="action action--danger" type="button">
                  <span class="action__label">Quit Rev</span>
                  <span class="action__hint">The tray icon goes too</span>
                </button>
              </div>
            </div>
          </div>
        </div>

        <footer class="panel__foot">
          <span id="conn" class="conn" data-state="offline">
            <i class="conn__dot" aria-hidden="true"></i>
            <span id="conn-label">connecting…</span>
          </span>
          <kbd class="kbd" aria-hidden="true">Esc</kbd>
          <button
            id="btn-hide"
            class="text-btn"
            type="button"
            aria-label="Hide Rev. It stays in the system tray."
            title="Hide Rev (it stays in the tray)"
          >
            Hide
          </button>
        </footer>
      </section>

      <p id="live-region" class="sr-only" role="status" aria-live="polite"></p>

      <!--
        The radial menu. Five destinations on an arc that fans out of Rev.
        A full circle cannot fit in a screen corner, so the arc sweeps 110
        degrees into the free space up and to the left.
      -->
      <nav id="radial" class="radial" aria-label="Rev menu" inert>
        <svg class="radial__guide" viewBox="0 0 300 300" aria-hidden="true">
          <path id="radial-arc" class="radial__arc" />
        </svg>

        <button class="radial__item" type="button" data-action="findings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 21V4.5" />
            <path class="fill" d="M6 4.5h11l-2.4 3.6L17 11.7H6Z" />
          </svg>
          <span class="radial__badge" id="radial-badge" hidden></span>
        </button>

        <button class="radial__item" type="button" data-action="console">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5 4.5H5.5A1.5 1.5 0 0 0 4 6v12a1.5 1.5 0 0 0 1.5 1.5h12A1.5 1.5 0 0 0 19 18v-8" />
            <path d="M14 10 20 4" />
            <path d="M15.5 3.5H20.5V8.5" />
          </svg>
        </button>

        <button class="radial__item" type="button" data-action="status">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 13.5h4l2.5-6 3.5 11 2.5-8 1.5 3h3" />
          </svg>
        </button>

        <button class="radial__item" type="button" data-action="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h10M18 8h2M4 16h4M12 16h8" />
            <circle class="fill" cx="16" cy="8" r="2.2" />
            <circle class="fill" cx="10" cy="16" r="2.2" />
          </svg>
        </button>

        <button class="radial__item" type="button" data-action="hide">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v10" />
            <path d="M8 10.5 12 14.5 16 10.5" />
            <path d="M5 19.5h14" />
          </svg>
        </button>

        <span id="radial-label" class="radial__label" aria-hidden="true"></span>
      </nav>

      <!-- Rev. A revision stamp with an aperture for a face. -->
      <div id="pet" class="pet" data-state="idle">
        <button
          id="pet-hit"
          class="pet__hit"
          type="button"
          aria-expanded="false"
          aria-label="Rev. Open menu."
        >
          <!--
            Rev's face is the Zamp "Risk Analyst" role glyph, vendored from the
            zamp-icons branch. It is an image rather than inline markup: 130KB of
            embedded artwork would triple the HTML this window parses on boot.

            State is carried around it — the ring arc, the glow behind it, the
            revision tab — so swapping the artwork never costs the status display.
          -->
          <!--
            Rev is the glyph, nothing else. No capsule, no ring: a companion
            that sits on your desktop all day should be a small object, not a
            widget with chrome. State is carried by a tinted glow behind the
            glyph and by the badge; the revision lives in the panel header,
            which is where you are when you care about it.
          -->
          <!--
            Rev's glyph: an original cute gear ("buddy"), eight soft teeth with the
            eyes and smile cut out, so it needs no third-party licence.

            Only the shape is kept. The original fills it with a raster texture,
            which at 92px is visibly grainy and fights the flat UI around it; the
            file was also 40KB of base64 for something that is one path. Inlined
            and flat-filled, it is 4KB, it scales cleanly at any DPI, and the
            glyph itself can carry state colour — which is why there is no longer
            a coloured glow behind it.
          -->
          <svg class="pet__face" viewBox="0 0 60 60" aria-hidden="true">
            <defs>
              <linearGradient id="glyph-fill" x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0%" stop-color="var(--glyph-a)" />
                <stop offset="100%" stop-color="var(--glyph-b)" />
              </linearGradient>
