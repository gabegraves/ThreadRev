<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Everything this window renders is bundled beside it, so nothing needs to
      be fetched, framed or evaluated. The only outbound request is the reviewer
      poll on loopback.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src http://localhost:3000; form-action 'none'; base-uri 'none'; frame-ancestors 'none'"
    />
    <title>Rev — ThreadRev</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root">
      <!-- The thread. Drawn from Rev up to the panel anchor while opening. -->
      <svg id="thread" class="thread" aria-hidden="true">
        <path id="thread-path" class="thread__path" />
      </svg>

      <section
        id="panel"
        class="panel"
        role="dialog"
        aria-label="ThreadRev findings"
        aria-modal="true"
        inert
      >
        <header class="panel__head">
          <span class="mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="mark__svg">
              <circle class="mark__ring" cx="12" cy="12" r="8" />
              <path class="mark__iris" d="M12 6.5 17 9.25 17 14.75 12 17.5 7 14.75 7 9.25Z" />
            </svg>
          </span>
          <div class="panel__ident">
            <span class="panel__name">Rev</span>
            <span id="panel-sub" class="panel__sub" role="status" aria-live="polite">watching</span>
          </div>
          <span
            id="rev-chip"
            class="chip chip--rev"
            title="Revision these findings are bound to"
          >
            —
          </span>
          <button id="panel-close" class="icon-btn" type="button" aria-label="Close panel">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <path d="M4 4l8 8M12 4l-8 8" />
            </svg>
          </button>
        </header>

        <div class="tabs" role="tablist" aria-label="Filter findings">
          <button
            class="tab"
            role="tab"
            id="tab-live"
            data-filter="live"
            aria-selected="true"
            aria-controls="panel-body"
            tabindex="0"
          >
            Live <span id="count-live" class="tab__n">0</span>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-stale"
            data-filter="stale"
            aria-selected="false"
            aria-controls="panel-body"
            tabindex="-1"
          >
            Stale <span id="count-stale" class="tab__n">0</span>
          </button>
          <button
            class="tab"
            role="tab"
            id="tab-all"
            data-filter="all"
            aria-selected="false"
            aria-controls="panel-body"
            tabindex="-1"
          >
            All
          </button>
        </div>

        <div class="scroller">
          <div
            id="panel-body"
            class="panel__body"
            role="tabpanel"
            aria-labelledby="tab-live"
            tabindex="0"
          ></div>
        </div>

        <footer class="panel__foot">
          <span id="conn" class="conn" data-state="offline">
            <i class="conn__dot" aria-hidden="true"></i>
            <span id="conn-label">connecting…</span>
          </span>
          <kbd class="kbd" aria-hidden="true">Esc</kbd>
          <button
            id="btn-hide"
            class="text-btn"
            type="button"
            aria-label="Hide Rev. It stays in the system tray."
            title="Hide Rev (it stays in the tray)"
          >
            Hide
          </button>
        </footer>
      </section>

      <p id="live-region" class="sr-only" role="status" aria-live="polite"></p>

      <!--
        The radial menu. Five destinations on an arc that fans out of Rev.
        A full circle cannot fit in a screen corner, so the arc sweeps 110
        degrees into the free space up and to the left.
      -->
      <nav id="radial" class="radial" aria-label="Rev menu" inert>
        <svg class="radial__guide" viewBox="0 0 300 300" aria-hidden="true">
          <path id="radial-arc" class="radial__arc" />
        </svg>

        <button class="radial__item" type="button" data-action="findings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 21V4.5" />
            <path class="fill" d="M6 4.5h11l-2.4 3.6L17 11.7H6Z" />
          </svg>
          <span class="radial__badge" id="radial-badge" hidden></span>
        </button>

        <button class="radial__item" type="button" data-action="console">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M13.5 4.5H5.5A1.5 1.5 0 0 0 4 6v12a1.5 1.5 0 0 0 1.5 1.5h12A1.5 1.5 0 0 0 19 18v-8" />
            <path d="M14 10 20 4" />
            <path d="M15.5 3.5H20.5V8.5" />
          </svg>
        </button>

        <button class="radial__item" type="button" data-action="voice">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5.5 11.5a6.5 6.5 0 0 0 13 0" />
            <path d="M12 18v3" />
          </svg>
        </button>

        <button class="radial__item" type="button" data-action="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 8h10M18 8h2M4 16h4M12 16h8" />
            <circle class="fill" cx="16" cy="8" r="2.2" />
            <circle class="fill" cx="10" cy="16" r="2.2" />
          </svg>
        </button>

        <button class="radial__item" type="button" data-action="hide">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v10" />
            <path d="M8 10.5 12 14.5 16 10.5" />
            <path d="M5 19.5h14" />
          </svg>
        </button>

        <span id="radial-label" class="radial__label" aria-hidden="true"></span>
      </nav>

      <!-- Rev. A revision stamp with an aperture for a face. -->
      <div id="pet" class="pet" data-state="idle">
        <button
          id="pet-hit"
          class="pet__hit"
          type="button"
          aria-expanded="false"
          aria-label="Rev. Open menu."
        >
          <svg class="pet__svg" viewBox="0 0 140 164" aria-hidden="true">
            <defs>
              <linearGradient id="body" x1="0.2" y1="0" x2="0.5" y2="1">
                <stop offset="0%" stop-color="var(--body-hi)" />
                <stop offset="55%" stop-color="var(--body-mid)" />
                <stop offset="100%" stop-color="var(--body-lo)" />
              </linearGradient>
              <linearGradient id="rimlight" x1="0" y1="0" x2="0.4" y2="1">
                <stop offset="0%" stop-color="rgb(255 255 255 / 0.5)" />
                <stop offset="45%" stop-color="rgb(255 255 255 / 0.06)" />
                <stop offset="100%" stop-color="rgb(255 255 255 / 0.16)" />
              </linearGradient>
              <radialGradient id="glass" cx="0.34" cy="0.28" r="0.9">
                <stop offset="0%" stop-color="var(--glass-hi)" />
                <stop offset="100%" stop-color="var(--glass-lo)" />
              </radialGradient>
              <clipPath id="lens-clip">
                <circle cx="70" cy="86" r="30" />
              </clipPath>
            </defs>

            <!-- revision tab, notched into the top of the stamp -->
            <g class="pet__tab">
              <path d="M46 40 v-13 a7 7 0 0 1 7-7 h34 a7 7 0 0 1 7 7 v13 Z" />
              <text id="pet-rev" x="70" y="35" text-anchor="middle">r—</text>
            </g>

            <!-- stamp body -->
            <rect x="14" y="34" width="112" height="112" rx="36" fill="url(#body)" />
            <rect
              class="pet__bevel"
              x="14.75"
              y="34.75"
              width="110.5"
              height="110.5"
              rx="35.25"
              stroke="url(#rimlight)"
            />

            <!-- state ring: readable from across the room -->
            <circle class="pet__state-ring" cx="70" cy="86" r="38.5" />

            <!-- lens -->
            <circle class="pet__housing" cx="70" cy="86" r="34" />
            <circle class="pet__glass" cx="70" cy="86" r="30" fill="url(#glass)" />

            <g clip-path="url(#lens-clip)">
              <!--
                Six blades. Alternating tones give the iris visible edges: a
                single flat fill reads as a hole, not as a mechanism.
              -->
              <g class="pet__blades">
                <path d="M70 86 L70 34 L115 60 Z" />
                <path class="alt" d="M70 86 L115 60 L115 112 Z" />
                <path d="M70 86 L115 112 L70 138 Z" />
                <path class="alt" d="M70 86 L70 138 L25 112 Z" />
                <path d="M70 86 L25 112 L25 60 Z" />
                <path class="alt" d="M70 86 L25 60 L70 34 Z" />
              </g>

              <!-- the opening -->
              <g class="pet__iris">
                <path
                  class="pet__opening"
                  d="M70 58 L94.2 72 L94.2 100 L70 114 L45.8 100 L45.8 72 Z"
                />
                <path
                  class="pet__opening-edge"
                  d="M70 58 L94.2 72 L94.2 100 L70 114 L45.8 100 L45.8 72 Z"
                />
                <g class="pet__pupil">
                  <circle class="pet__glow" cx="70" cy="86" r="15" />
                  <circle class="pet__iris-dot" cx="70" cy="86" r="9.5" />
                  <circle class="pet__spec" cx="65.5" cy="81.5" r="3.2" />
                </g>
              </g>

              <!-- staleness: a hairline fracture across the glass -->
              <path class="pet__crack" d="M44 66 L62 84 L55 97 L79 109 L70 92 L98 72" />
            </g>

            <circle class="pet__rim" cx="70" cy="86" r="30" />

            <!-- checker tick marks, shown while recomputing -->
            <g class="pet__ticks">
              <path d="M70 42 v8" />
              <path d="M114 86 h-8" />
              <path d="M70 130 v-8" />
              <path d="M26 86 h8" />
            </g>

            <!-- sleep -->
            <g class="pet__zzz">
              <text x="110" y="44">z</text>
              <text x="123" y="29">z</text>
            </g>
          </svg>

          <span id="pet-count" class="pet__count" hidden></span>
        </button>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
