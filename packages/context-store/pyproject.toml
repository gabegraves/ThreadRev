[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-store"
version = "0.1.0"
description = "Conversation-memory chunk storage + 3-stage retrieval (pgvector HNSW -> collapse -> MMR), extracted from Zamp pantheon."
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "pgvector>=0.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "openai>=1.0",
    "tiktoken>=0.7",
    "numpy>=1.26",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
include = ["context_store*"]
