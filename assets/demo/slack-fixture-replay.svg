<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="930" viewBox="0 0 1440 930" role="img" aria-labelledby="title desc">
  <title id="title">ThreadRev fixture replay in a Slack-style engineering thread</title>
  <desc id="desc">A fictional Kestrel Motors engineering thread shows a document upload, a relay timing note, a request to Rev, and a checker-backed review card.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#1c1f25"/><stop offset="1" stop-color="#14161b"/></linearGradient>
    <linearGradient id="card" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#252a32"/><stop offset="1" stop-color="#1e2229"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1440" height="930" fill="url(#bg)"/>
  <rect width="286" height="930" fill="#17191e"/>
  <rect x="286" width="1154" height="72" fill="#1b1e24"/>
  <path d="M286 72H1440" stroke="#30343c"/>
  <path d="M286 0V930" stroke="#30343c"/>

  <rect x="24" y="24" width="44" height="44" rx="12" fill="#5d3ec8"/>
  <path d="M38 51l8-12 8 12-8 8z" fill="#fff" opacity=".95"/>
  <text x="82" y="44" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="18" font-weight="700">Kestrel Motors</text>
  <text x="82" y="64" fill="#9198a7" font-family="Arial, sans-serif" font-size="12">engineering workspace</text>

  <text x="24" y="120" fill="#9198a7" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">CHANNELS</text>
  <text x="28" y="160" fill="#b9bfca" font-family="Arial, sans-serif" font-size="16">#  ks4-general</text>
  <rect x="14" y="177" width="256" height="42" rx="8" fill="#343341"/>
  <text x="28" y="204" fill="#fff" font-family="Arial, sans-serif" font-size="16" font-weight="700">#  ks4-electrical</text>
  <rect x="226" y="188" width="26" height="20" rx="10" fill="#f3be5a"/>
  <text x="239" y="203" text-anchor="middle" fill="#1d2026" font-family="Arial, sans-serif" font-size="11" font-weight="700">1</text>
  <text x="28" y="258" fill="#b9bfca" font-family="Arial, sans-serif" font-size="16">#  ks4-purchasing</text>
  <text x="28" y="310" fill="#b9bfca" font-family="Arial, sans-serif" font-size="16">#  test-stand</text>
  <text x="24" y="378" fill="#9198a7" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">APPS</text>
  <rect x="18" y="402" width="250" height="68" rx="10" fill="#20232a"/>
  <circle cx="46" cy="436" r="16" fill="#f06449"/>
  <path d="M39 441l6-11 5 7 6-8-7 16z" fill="#fff"/>
  <text x="74" y="430" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="15" font-weight="700">Rev</text>
  <text x="74" y="451" fill="#9ca3b2" font-family="Arial, sans-serif" font-size="12">decision reviewer</text>

  <text x="320" y="32" fill="#f8f9fb" font-family="Arial, sans-serif" font-size="18" font-weight="700"># ks4-electrical</text>
  <text x="320" y="53" fill="#a0a7b5" font-family="Arial, sans-serif" font-size="12">Precharge RC timing · 4 members</text>
  <rect x="1193" y="20" width="212" height="32" rx="16" fill="#262a32" stroke="#3a404a"/>
  <circle cx="1214" cy="36" r="5" fill="#f3be5a"/>
  <text x="1228" y="40" fill="#d5d9e1" font-family="Arial, sans-serif" font-size="12" font-weight="700">FIXTURE REPLAY</text>

  <text x="322" y="114" fill="#87909f" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">TODAY</text>

  <circle cx="342" cy="160" r="19" fill="#e7a65a"/>
  <text x="342" y="166" text-anchor="middle" fill="#342215" font-family="Arial, sans-serif" font-size="15" font-weight="700">D</text>
  <text x="374" y="153" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="15" font-weight="700">Dara Voss</text>
  <text x="461" y="153" fill="#8f98a8" font-family="Arial, sans-serif" font-size="12">10:02 AM</text>
  <text x="374" y="178" fill="#d6dbe4" font-family="Arial, sans-serif" font-size="15">Uploaded precharge-review-r2.docx — bus is now 680 μF.</text>
  <rect x="374" y="192" width="362" height="62" rx="8" fill="#252a31" stroke="#3b414b"/>
  <rect x="388" y="205" width="34" height="36" rx="5" fill="#4176c8"/>
  <path d="M398 213h14M398 219h14M398 225h10" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="436" y="217" fill="#eef1f5" font-family="Arial, sans-serif" font-size="14" font-weight="700">precharge-review-r2.docx</text>
  <text x="436" y="238" fill="#929bab" font-family="Arial, sans-serif" font-size="12">review document · r2</text>

  <circle cx="342" cy="302" r="19" fill="#76b7a2"/>
  <text x="342" y="308" text-anchor="middle" fill="#12362c" font-family="Arial, sans-serif" font-size="15" font-weight="700">T</text>
  <text x="374" y="295" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="15" font-weight="700">Tam Holloway</text>
  <text x="489" y="295" fill="#8f98a8" font-family="Arial, sans-serif" font-size="12">10:04 AM</text>
  <text x="374" y="320" fill="#d6dbe4" font-family="Arial, sans-serif" font-size="15">Relay close timer in firmware is still 2.5 s. Matches the doc.</text>

  <circle cx="342" cy="372" r="19" fill="#9b8ee5"/>
  <text x="342" y="378" text-anchor="middle" fill="#281d58" font-family="Arial, sans-serif" font-size="15" font-weight="700">J</text>
  <text x="374" y="365" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="15" font-weight="700">Juno Marsh</text>
  <text x="470" y="365" fill="#8f98a8" font-family="Arial, sans-serif" font-size="12">10:05 AM</text>
  <text x="374" y="390" fill="#d6dbe4" font-family="Arial, sans-serif" font-size="15">@Rev can you check section 3 before I sign?</text>

  <circle cx="342" cy="460" r="20" fill="#f06449"/>
  <path d="M334 466l7-14 5 8 7-10-9 18z" fill="#fff"/>
  <text x="374" y="451" fill="#f5f7fb" font-family="Arial, sans-serif" font-size="15" font-weight="700">Rev</text>
  <text x="405" y="451" fill="#8f98a8" font-family="Arial, sans-serif" font-size="12">10:06 AM</text>
  <rect x="374" y="468" width="910" height="352" rx="13" fill="url(#card)" stroke="#434b58" filter="url(#shadow)"/>
  <rect x="374" y="468" width="7" height="352" rx="3.5" fill="#f06449"/>
  <rect x="404" y="493" width="134" height="25" rx="12.5" fill="#5e2f2f"/>
  <text x="471" y="510" text-anchor="middle" fill="#ffb2a9" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8">REVIEW NEEDED</text>
  <text x="560" y="510" fill="#a8b0be" font-family="Arial, sans-serif" font-size="12">revision 1789239746.015919</text>
  <text x="404" y="556" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">Section 3 does not reproduce</text>
  <text x="404" y="587" fill="#d4d9e2" font-family="Arial, sans-serif" font-size="15">The document states 680 μF, but the section 2 diagram states 750 μF.</text>
  <text x="404" y="615" fill="#d4d9e2" font-family="Arial, sans-serif" font-size="15">The printed 2.435 s only reproduces at 750 μF; 680 μF gives 2.208 s.</text>
  <path d="M404 643H1254" stroke="#414854"/>
  <text x="404" y="672" fill="#9ea8b9" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">REPRODUCED BY CHECKER</text>
  <rect x="404" y="687" width="250" height="44" rx="7" fill="#1a1e25"/>
  <text x="419" y="705" fill="#a9b2c1" font-family="Arial, sans-serif" font-size="11">750 μF</text>
  <text x="419" y="722" fill="#f4f6f9" font-family="Arial, sans-serif" font-size="15" font-weight="700">2.435 s</text>
  <rect x="667" y="687" width="250" height="44" rx="7" fill="#1a1e25"/>
  <text x="682" y="705" fill="#a9b2c1" font-family="Arial, sans-serif" font-size="11">680 μF</text>
  <text x="682" y="722" fill="#f4f6f9" font-family="Arial, sans-serif" font-size="15" font-weight="700">2.208 s</text>
  <rect x="930" y="687" width="324" height="44" rx="7" fill="#1a1e25"/>
  <text x="945" y="705" fill="#a9b2c1" font-family="Arial, sans-serif" font-size="11">checker run</text>
  <text x="945" y="722" fill="#f4f6f9" font-family="Arial, sans-serif" font-size="14" font-weight="700">rc-20260912T…</text>
  <text x="404" y="766" fill="#f0c776" font-family="Arial, sans-serif" font-size="14" font-weight="700">Question for Dara</text>
  <text x="404" y="791" fill="#d4d9e2" font-family="Arial, sans-serif" font-size="14">Which capacitance is correct before Juno signs the review?</text>
  <rect x="1131" y="758" width="123" height="34" rx="7" fill="#5738be"/>
  <text x="1192" y="780" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="13" font-weight="700">View evidence</text>

  <rect x="322" y="855" width="1075" height="48" rx="10" fill="#282c34" stroke="#424955"/>
  <text x="346" y="885" fill="#9da6b5" font-family="Arial, sans-serif" font-size="15">Reply in #ks4-electrical</text>
</svg>
